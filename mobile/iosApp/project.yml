name: CoupleApp
options:
  bundleIdPrefix: dev.coupleapp
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS: "$(inherited) -framework CoupleShared"
targets:
  CoupleApp:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.coupleapp.local
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    preBuildScripts:
      - name: Build shared Kotlin framework
        script: |
          cd "$SRCROOT/.."
          "${COUPLE_GRADLE_EXECUTABLE:-./gradlew}" :shared:embedAndSignAppleFrameworkForXcode -Pkotlin.compiler.execution.strategy=in-process
        basedOnDependencyAnalysis: false
schemes:
  CoupleApp:
    build:
      targets:
        CoupleApp: all
